name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

      - name: Bundle JavaScript for Android
        run: npx expo export --platform android --output-dir dist

  android-build:
    name: Android build
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - uses: gradle/actions/setup-gradle@v4

      # No upload key here, so the release build falls back to debug signing.
      # Building a single ABI keeps the check fast; releases build all of them.
      - name: Build release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
