name: CI

# Fast checks only, on pull requests and pushes to main. Native Android builds
# never run automatically here: use apk.yml (on demand) or release.yml (tags).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

      - name: Bundle JavaScript for Android
        run: npx expo export --platform android --output-dir dist

